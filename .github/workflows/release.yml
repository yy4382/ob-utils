name: Release plugin

on:
    push:
        tags:
            - "*.*.*"

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Validate release version
              env:
                  RELEASE_TAG: ${{ github.ref_name }}
              run: |
                  node --input-type=module <<'NODE'
                  import assert from "node:assert/strict";
                  import { readFileSync } from "node:fs";

                  const readJson = (path) => JSON.parse(readFileSync(path, "utf8"));
                  const manifest = readJson("manifest.json");
                  const pkg = readJson("package.json");
                  const versions = readJson("versions.json");
                  const tag = process.env.RELEASE_TAG;

                  assert.match(tag, /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/, "Use an x.y.z tag without a v prefix");
                  assert.equal(tag, manifest.version, "Tag must match manifest.json version");
                  assert.equal(tag, pkg.version, "Tag must match package.json version");
                  assert.equal(versions[tag], manifest.minAppVersion, "Update versions.json for this release");
                  NODE

            - run: pnpm install --frozen-lockfile
            - run: pnpm run lint
            - run: pnpm run build

            - name: Publish GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  RELEASE_TAG: ${{ github.ref_name }}
              run: |
                  assets=(main.js manifest.json)
                  if [[ -f styles.css ]]; then
                      assets+=(styles.css)
                  fi
                  gh release create "$RELEASE_TAG" "${assets[@]}" \
                      --verify-tag \
                      --title "$RELEASE_TAG" \
                      --generate-notes
